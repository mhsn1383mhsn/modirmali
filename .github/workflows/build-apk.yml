name: Build Finance APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # IMPORTANT:
      # Do NOT enable setup-node caching here. Caching requires a lockfile
      # (package-lock.json/yarn.lock/pnpm-lock.yaml), while this project
      # intentionally installs from package.json.
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          check-latest: false

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install npm dependencies
        shell: bash
        run: |
          npm install --no-package-lock --no-audit --no-fund

      - name: Verify Capacitor CLI
        shell: bash
        run: |
          npx cap --version

      - name: Self-test financial math
        shell: bash
        run: |
          node tests/selftest.mjs

      - name: Regenerate focus pages
        shell: bash
        run: |
          python3 scripts/build-focus-pages.py

      - name: Create Android project
        shell: bash
        run: |
          rm -rf android
          npx cap add android

      - name: Bundle Supabase web SDK
        shell: bash
        run: |
          node scripts/copy-vendor.js

      - name: Patch Android native features
        shell: bash
        run: |
          node scripts/patch-android.js

      - name: Generate app icons
        shell: bash
        run: |
          npx capacitor-assets generate --android

      - name: Sync web files
        shell: bash
        run: |
          npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Upload build reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            android/app/build/reports
            android/app/src/main/java
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Finance-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
